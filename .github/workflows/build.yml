name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (sandboxed, ad-hoc signed)
        run: ./scripts/build-app.sh
      - name: Test Office input limits and conversion regressions
        run: swift test
      - name: Package
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Release/FileFlipper.app build/FileFlipper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FileFlipper
          path: build/FileFlipper.zip
